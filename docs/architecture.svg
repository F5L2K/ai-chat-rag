<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="460" fill="#f8fafc"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">AIChat 检索链路：双路召回 → 精排 → 带引用生成</text>

  <!-- 知识库 -->
  <rect x="30" y="330" width="250" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="155" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#075985">知识库（本地）</text>
  <text x="155" y="382" text-anchor="middle" font-size="12" fill="#075985">FAISS 向量索引</text>
  <text x="155" y="402" text-anchor="middle" font-size="12" fill="#075985">SQLite · chunks 表（BM25 内存索引派生）</text>

  <!-- 1. 用户 -->
  <rect x="30" y="120" width="130" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="95" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">用户提问</text>
  <text x="95" y="172" text-anchor="middle" font-size="11" fill="#64748b">Streamlit 前端</text>
  <text x="95" y="188" text-anchor="middle" font-size="11" fill="#64748b">SSE 流式接收</text>

  <!-- 2. 双路召回 -->
  <rect x="200" y="90" width="240" height="140" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="320" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#075985">① 双路召回</text>
  <text x="320" y="142" text-anchor="middle" font-size="12" fill="#0f172a">稠密路：FAISS 向量检索（语义）</text>
  <text x="320" y="164" text-anchor="middle" font-size="12" fill="#0f172a">稀疏路：BM25 + jieba（字面编号）</text>
  <text x="320" y="190" text-anchor="middle" font-size="12" fill="#075985">RRF 融合两路名次</text>
  <text x="320" y="212" text-anchor="middle" font-size="11" fill="#64748b">可分别关闭，退回单路稠密</text>

  <!-- 3. 精排 -->
  <rect x="480" y="120" width="160" height="80" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="560" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#6d28d9">② Cross-encoder 精排</text>
  <text x="560" y="172" text-anchor="middle" font-size="11" fill="#64748b">bge-reranker-base</text>
  <text x="560" y="188" text-anchor="middle" font-size="11" fill="#64748b">pointwise 重排 top-K</text>

  <!-- 4. Prompt -->
  <rect x="690" y="120" width="150" height="80" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="765" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">③ Prompt 组装</text>
  <text x="765" y="170" text-anchor="middle" font-size="11" fill="#64748b">资料编号 [1][2]</text>
  <text x="765" y="186" text-anchor="middle" font-size="11" fill="#64748b">要求标注来源</text>

  <!-- 5. 生成 -->
  <rect x="690" y="250" width="150" height="80" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="765" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">④ DeepSeek 流式生成</text>
  <text x="765" y="300" text-anchor="middle" font-size="11" fill="#64748b">回答 + 引用标记</text>
  <text x="765" y="316" text-anchor="middle" font-size="11" fill="#64748b">前端渲染来源卡片</text>

  <!-- 箭头 -->
  <line x1="160" y1="160" x2="198" y2="160" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="440" y1="160" x2="478" y2="160" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="640" y1="160" x2="688" y2="160" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="765" y1="200" x2="765" y2="248" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="320" y1="230" x2="175" y2="328" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="155" y1="330" x2="155" y2="205" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,4"/>

  <text x="205" y="265" font-size="11" fill="#0284c7">读写索引 / chunks</text>

  <!-- 底部注释 -->
  <text x="480" y="445" text-anchor="middle" font-size="12" fill="#475569">评估：Hit@K / MRR@K / SecHit@K —— 章节感知切块让引用可定位到具体小节</text>
</svg>
